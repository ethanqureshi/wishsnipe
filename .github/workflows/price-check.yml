name: Price Check (every 6 hours)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger WishSnipe price check
        run: |
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://wishsnipe.vercel.app/api/cron/check-prices)
          BODY=$(echo "$RESPONSE" | sed -n '/HTTP_STATUS:/!p')
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d: -f2)
          echo "Response body: $BODY"
          echo "HTTP status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Price check failed with HTTP $STATUS"
            exit 1
          fi
