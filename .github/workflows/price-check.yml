name: Price Check (every 6 hours)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger WishSnipe price check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://wishsnipe.vercel.app/api/cron/check-prices)
          echo "Response status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Price check failed with HTTP $STATUS"
            exit 1
          fi
