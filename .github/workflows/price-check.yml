name: Price Check (every 6 hours)

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger WishSnipe price check
        run: |
          RESPONSE=$(curl -s -X GET -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" https://wishsnipe.vercel.app/api/cron/check-prices)
          echo "Response body: $RESPONSE"
          if [[ "$RESPONSE" != *'"ok":true'* ]]; then
            echo "Price check failed"
            exit 1
          fi
